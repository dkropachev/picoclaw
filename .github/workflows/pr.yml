name: PR

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used by the delta checks
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  BASE_REF_NAME: ${{ github.base_ref || inputs.base_ref || github.event.repository.default_branch }}
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      go_cache_epoch: ${{ steps.go-cache-key.outputs.epoch }}
      lint: ${{ steps.changes.outputs.lint }}
      frontend: ${{ steps.changes.outputs.frontend }}
      frontend_ui: ${{ steps.changes.outputs.frontend_ui }}
      vuln_check: ${{ steps.changes.outputs.vuln_check }}
      test: ${{ steps.changes.outputs.test }}
      cross_compile: ${{ steps.changes.outputs.cross_compile }}
      coverage: ${{ steps.changes.outputs.coverage }}
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - name: Compute Go cache generation
        id: go-cache-key
        run: echo "epoch=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            classification="$(bash ./scripts/ci-changed-paths.sh --force-all)"
          else
            classification="$(
              git diff --name-status -z --find-renames --find-copies \
                "${BASE_SHA}...${HEAD_SHA}" | \
                bash ./scripts/ci-changed-paths.sh
            )"
          fi
          printf '%s\n' "${classification}" | tee -a "${GITHUB_OUTPUT}"

  lint:
    name: Linter
    needs: classify
    if: ${{ needs.classify.outputs.lint != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

      - name: Feature requirements lint
        run: make lint-features

      - name: Feature tooling tests
        run: make test-featuretools

      - name: Fetch base ref
        run: git fetch origin "${BASE_REF_NAME}:refs/remotes/origin/${BASE_REF_NAME}"

      - name: Feature requirements delta guard
        run: make feature-delta BASE_REF="origin/${BASE_REF_NAME}" HEAD_REF=HEAD

  frontend:
    name: Frontend
    needs: classify
    if: ${{ needs.classify.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Frontend lint
        run: make lint-frontend

      - name: Collection governance tests
        run: make test-collection-governance

      - name: Frontend unit tests
        run: cd web/frontend && pnpm test

      - name: Launcher production build
        run: make build-launcher

      - name: Fetch base ref
        run: git fetch origin "${BASE_REF_NAME}:refs/remotes/origin/${BASE_REF_NAME}"

      - name: Collection surface delta guard
        run: make collection-delta BASE_REF="origin/${BASE_REF_NAME}" HEAD_REF=HEAD

  frontend_ui:
    name: Frontend UI (${{ matrix.label }})
    needs: classify
    if: ${{ needs.classify.outputs.frontend_ui != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: smoke / desktop
            suite: smoke
            project: desktop
            artifact: smoke-desktop
          - label: smoke / mobile
            suite: smoke
            project: mobile
            artifact: smoke-mobile
          - label: visual
            suite: visual
            project: all
            artifact: visual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: cd web/frontend && pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: cd web/frontend && pnpm exec playwright install --with-deps chromium

      - name: Frontend UI smoke tests
        if: matrix.suite == 'smoke'
        run: cd web/frontend && pnpm exec playwright test tests/ui-smoke.spec.ts --project="${{ matrix.project }}"

      - name: Frontend collection visual tests
        if: matrix.suite == 'visual'
        run: cd web/frontend && COLLECTION_VISUAL_BASELINE=system pnpm test:ui:visual

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.artifact }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/frontend/playwright-report
            web/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  vuln_check:
    name: Security Check
    needs: classify
    if: ${{ needs.classify.outputs.vuln_check != 'false' }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests (${{ matrix.shard }})
    needs: classify
    if: ${{ needs.classify.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [slow, workspace, remaining]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Run go generate
        if: matrix.shard == 'remaining'
        run: go generate ./...

      - name: Run Go test shard
        run: go run ./scripts/hermetic-go-test -- bash ./scripts/run-go-test-shard.sh "${{ matrix.shard }}"

  cross_compile:
    name: Cross-compile core binaries
    needs: classify
    if: ${{ needs.classify.outputs.cross_compile != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore cross-platform Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-cross-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-cross-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-cross-

      - name: Cross-compile core binaries
        run: make build-all

  coverage:
    name: Coverage Delta
    needs: classify
    if: ${{ needs.classify.outputs.coverage != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Fetch base ref
        run: git fetch origin "${BASE_REF_NAME}:refs/remotes/origin/${BASE_REF_NAME}"

      - name: Coverage delta guard
        run: make coverage-delta BASE_REF="origin/${BASE_REF_NAME}" HEAD_REF=HEAD

  integration:
    name: Integration Tests
    needs: classify
    if: ${{ needs.classify.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore host Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-${{ needs.classify.outputs.go_cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v3-host-

      - name: Run integration suites
        run: bash ./scripts/run-integration-tests.sh

  required:
    name: ${{ github.event_name == 'pull_request' && 'PR Required' || 'Manual Validation' }}
    if: ${{ always() }}
    needs:
      - classify
      - lint
      - frontend
      - frontend_ui
      - vuln_check
      - test
      - cross_compile
      - coverage
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected checks
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LINT_REQUIRED: ${{ needs.classify.outputs.lint }}
          LINT_RESULT: ${{ needs.lint.result }}
          FRONTEND_REQUIRED: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_UI_REQUIRED: ${{ needs.classify.outputs.frontend_ui }}
          FRONTEND_UI_RESULT: ${{ needs.frontend_ui.result }}
          VULN_CHECK_REQUIRED: ${{ needs.classify.outputs.vuln_check }}
          VULN_CHECK_RESULT: ${{ needs.vuln_check.result }}
          TEST_REQUIRED: ${{ needs.classify.outputs.test }}
          TEST_RESULT: ${{ needs.test.result }}
          CROSS_COMPILE_REQUIRED: ${{ needs.classify.outputs.cross_compile }}
          CROSS_COMPILE_RESULT: ${{ needs.cross_compile.result }}
          COVERAGE_REQUIRED: ${{ needs.classify.outputs.coverage }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          INTEGRATION_REQUIRED: ${{ needs.classify.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            echo "Change classifier did not succeed: ${CLASSIFY_RESULT}" >&2
            exit 1
          fi

          check_result() {
            local name="$1"
            local required="$2"
            local result="$3"
            case "${required}" in
              true)
                if [[ "${result}" != "success" ]]; then
                  echo "${name} was required but finished as ${result}" >&2
                  return 1
                fi
                ;;
              false)
                if [[ "${result}" != "skipped" ]]; then
                  echo "${name} was not required but finished as ${result}" >&2
                  return 1
                fi
                ;;
              *)
                echo "${name} has invalid classifier output: ${required}" >&2
                return 1
                ;;
            esac
          }

          check_result lint "${LINT_REQUIRED}" "${LINT_RESULT}"
          check_result frontend "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
          check_result frontend_ui "${FRONTEND_UI_REQUIRED}" "${FRONTEND_UI_RESULT}"
          check_result vuln_check "${VULN_CHECK_REQUIRED}" "${VULN_CHECK_RESULT}"
          check_result test "${TEST_REQUIRED}" "${TEST_RESULT}"
          check_result cross_compile "${CROSS_COMPILE_REQUIRED}" "${CROSS_COMPILE_RESULT}"
          check_result coverage "${COVERAGE_REQUIRED}" "${COVERAGE_RESULT}"
          check_result integration "${INTEGRATION_REQUIRED}" "${INTEGRATION_RESULT}"
