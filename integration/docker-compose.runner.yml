services:
  integration-runner:
    image: golang:1.25.13-bookworm
    user: "${INTEGRATION_RUNNER_UID}:${INTEGRATION_RUNNER_GID}"
    working_dir: "${INTEGRATION_REPO_ROOT}"
    entrypoint: ["bash", "-c"]
    volumes:
      - type: bind
        source: "${INTEGRATION_REPO_ROOT}"
        target: "${INTEGRATION_REPO_ROOT}"
        bind:
          create_host_path: false
      - type: bind
        source: "${INTEGRATION_REPO_ROOT}"
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: "${INTEGRATION_GOCACHE}"
        target: "${INTEGRATION_GOCACHE}"
        bind:
          create_host_path: false
      - type: bind
        source: "${INTEGRATION_GOMODCACHE}"
        target: "${INTEGRATION_GOMODCACHE}"
        bind:
          create_host_path: false
    environment:
      HOME: /tmp/picoclaw-integration-home
      GOCACHE: "${INTEGRATION_GOCACHE}"
      GOMODCACHE: "${INTEGRATION_GOMODCACHE}"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      GOFLAGS: -tags=goolm,stdjson,integration
