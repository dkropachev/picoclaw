name: picoclaw

services:
  # ─────────────────────────────────────────────
  # PicoClaw Launcher (default single-node Web Console + API + Gateway)
  #   docker compose -f docker/docker-compose.yml up --remove-orphans
  # ─────────────────────────────────────────────
  picoclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: docker.io/sipeed/picoclaw:launcher
    container_name: picoclaw-launcher
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      PICOCLAW_GATEWAY_HOST: 127.0.0.1
    ports:
      - "${PICOCLAW_LAUNCHER_BIND:-127.0.0.1}:18800:18800"
    volumes:
      - ./data:/root/.picoclaw
